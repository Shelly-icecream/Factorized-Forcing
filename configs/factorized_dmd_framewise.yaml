# RTX4090 profile: keep hardware settings separate from the A100 branch.
# 1.3B models, generator LoRA, CPU offload and 12 latent frames.
trainer: score_distillation
factorized_enabled: true
data_path: prompts/processed/results.jsonl
factorized_parser_version: spacy_en_v1_multi_action
generator_ckpt: checkpoints/framewise/causal_forcing.pt
resume: null
logdir: factorized_outputs/training

real_name: Wan2.1-T2V-1.3B
fake_name: Wan2.1-T2V-1.3B
staged_fsdp_init: true
sharding_strategy: full
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
text_encoder_fsdp_wrap_strategy: size
generator_cpu_offload: true
real_score_cpu_offload: true
fake_score_cpu_offload: true
text_encoder_cpu_offload: true
train_fake_score: true
mixed_precision: true
gradient_checkpointing: true
factorized_activation_cpu_offload: false
model_kwargs:
  timestep_shift: 5.0
  lora_rank: 8
  lora_alpha: 8

denoising_step_list: [1000, 750, 500, 250]
warp_denoising_step: true
num_train_timestep: 1000
timestep_shift: 5.0
ts_schedule: false
# Baseline convention: teacher_cond + 3 * (teacher_cond - teacher_negative).
guidance_scale: 3.0
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
denoising_loss_type: flow
distribution_loss: dmd
num_frame_per_block: 1
num_training_frames: 12
image_or_video_shape: [1, 12, 16, 60, 104]
batch_size: 1
load_raw_video: false

factorized_microbatch: 1
factorized_normalize: true
factorized_component_weights: {empty: 1.0, P: 0.5, B: 0.5, A: 0.5, PAB: 1.0}
z_normalization_mode: per_sample
z_ema_decay: 0.99
z_ema_eps: 1.0e-6
lr: 2.0e-6
lr_critic: 4.0e-7
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
max_grad_norm_generator: 10.0
max_grad_norm_critic: 10.0
dfake_gen_update_ratio: 5
ema_weight: 0.99
ema_start_step: 200
max_train_steps: 10
log_iters: 100
seed: 42
